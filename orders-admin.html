<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات الشراء - مكتبة الهاشمي</title><style>
:root{--bg:#080808;--card:#111;--line:#302a1a;--gold:#d4aa27;--gold2:#f0d77a;--text:#f7f3e9;--muted:#aaa397}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17130a,#070707 40%);color:var(--text);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:14px}.panel{background:#111;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.head,.top,.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.head h1{font-size:21px;color:var(--gold2);margin:0}.muted{color:var(--muted)}button,.btn{border:1px solid var(--gold);background:var(--gold);color:#17120a;font-weight:bold;border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none}.ghost{background:transparent;color:var(--gold2)}input,select{background:#090909;color:white;border:1px solid #383838;border-radius:10px;padding:12px;font:inherit}.tools input{flex:1;min-width:200px}.orders{display:grid;gap:10px}.order{border:1px solid #302a1a;border-radius:15px;padding:15px;background:#0d0d0d}.title{font-weight:bold;color:var(--gold2);font-size:17px}.info{line-height:1.9;color:#ddd;margin-top:8px;font-size:14px}.badge{border:1px solid #51451f;border-radius:99px;padding:5px 10px;color:var(--gold2)}.empty{text-align:center;color:var(--muted);padding:25px}.error{color:#ffaaa0}.stats{display:flex;gap:15px;flex-wrap:wrap}.stats b{color:var(--gold2);font-size:20px}@media(max-width:600px){.tools{align-items:stretch}.tools>*{width:100%}}
</style></head><body><main class="wrap">
<header class="panel head"><div><h1>📋 طلبات الشراء</h1><div class="muted">مكتبة الهاشمي</div></div><div><a class="btn ghost" href="index.html">لوحة المحتوى</a> <button id="refresh">↻ تحديث</button> <button id="logout">خروج</button></div></header>
<section class="panel stats"><div>كل الطلبات <b id="all">0</b></div><div>قيد الانتظار <b id="pending">0</b></div><div>مدفوع <b id="paid">0</b></div><div>مسلّم <b id="done">0</b></div></section>
<section class="panel"><div class="tools"><input id="search" placeholder="ابحث برقم الطلب أو الاسم أو الكتاب"><select id="filter"><option value="all">كل الحالات</option><option value="pending">قيد الانتظار</option><option value="paid">مدفوع</option><option value="failed">فشل</option><option value="cancelled">ملغى</option></select></div><div id="message" class="muted" style="padding:10px 0"></div><div id="orders" class="orders"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://bfiobmxgkxrmkukorqdq.supabase.co','sb_publishable_3zAtbhl55a-jSMvuIGd6cw_LFv1nyCJ');const $=id=>document.getElementById(id);let rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const price=v=>Number(v||0).toLocaleString('ar-IQ')+' د.ع';const status={pending:'⏳ قيد الانتظار',paid:'✅ مدفوع',failed:'❌ فشل',cancelled:'🚫 ملغى'};
async function load(){ $('message').textContent='جاري تحميل الطلبات...';$('orders').innerHTML='';try{const {data:{session},error:se}=await db.auth.getSession();if(se)throw se;if(!session){$('message').innerHTML='سجّل دخولك من لوحة الإدارة أولاً. <a href="index.html" style="color:#f0d77a">فتح صفحة الدخول</a>';return}const {data:admin,error:ae}=await db.from('admin_users').select('id').eq('id',session.user.id).maybeSingle();if(ae)throw ae;if(!admin){$('message').textContent='هذا الحساب غير مخوّل لعرض الطلبات.';return}const {data,error}=await db.from('orders').select('*,content(title)').order('created_at',{ascending:false});if(error)throw error;rows=data||[];render()}catch(e){$('message').innerHTML='<span class="error">تعذر تحميل الطلبات: '+esc(e.message||'خطأ غير معروف')+'</span>'}}
function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const data=rows.filter(x=>(f==='all'||x.payment_status===f)&&(!q||[x.order_number,x.customer_name,x.customer_phone,x.customer_telegram,x.content?.title].some(v=>String(v||'').toLowerCase().includes(q))));$('all').textContent=rows.length;$('pending').textContent=rows.filter(x=>x.payment_status==='pending').length;$('paid').textContent=rows.filter(x=>x.payment_status==='paid').length;$('done').textContent=rows.filter(x=>x.fulfillment_status==='fulfilled').length;if(!data.length){$('orders').innerHTML='<div class="empty">لا توجد طلبات مطابقة.</div>';return}$('orders').innerHTML=data.map(x=>'<article class="order"><div class="top"><div class="title">📚 '+esc(x.content?.title||'محتوى')+'</div><span class="badge">'+esc(status[x.payment_status]||x.payment_status||'غير محدد')+'</span></div><div class="info">🧾 رقم الطلب: '+esc(x.order_number||'—')+'<br>👤 الزبون: '+esc(x.customer_name||'غير مذكور')+'<br>📞 الهاتف: '+esc(x.customer_phone||'غير مذكور')+'<br>💬 تلغرام: '+esc(x.customer_telegram||'غير مذكور')+'<br>💰 المبلغ: '+price(x.amount)+'<br>📦 حالة التجهيز: '+esc(x.fulfillment_status||'قيد الانتظار')+'<br>🔐 رمز الاستلام: '+esc(x.claim_code||'غير موجود')+'<br>📅 '+(x.created_at?new Date(x.created_at).toLocaleString('ar-IQ'):'—')+'</div></article>').join('')}
$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('refresh').addEventListener('click',load);$('logout').addEventListener('click',async()=>{await db.auth.signOut();location.href='index.html'});load();
</script></body></html>
